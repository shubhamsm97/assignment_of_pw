<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>assignment_grid_10.4</title>
</head>
<style>
    * {
        padding: 0px;
        margin: 0px;
        box-sizing: border-box;
    }
    .container {
        display: grid;
        /* grid-auto-columns: auto; */
        /* grid-auto-rows: auto; */
        /* justify-self: center; */
        justify-items:center;
        
    }
    .box {
        background-color: rgb(101, 28, 219);
        color:white;
        margin: .8rem;
    }
    .box8 {
       
        justify-self: right;
    }

</style>
<body>
    <div class="container">
        <div class="content"><p>justify-items is a attribute of grid, set on the container lavel, controls the alignment of grid items and follow the track </p>
        <br>   <p>justify-self property overrides justify-items on individual items.</p>
        </div>

        <div class="box box1">1 </div>
        <div class="box box2">2</div>
        <div class="box box3">3</div>
        <div class="box box4">4</div>
        <div class="box box5">5</div>
        <div class="box box6">6</div>
        <div class="box box7">7</div>
        <div class="box box8">8</div>
     </div>
    
</body>
