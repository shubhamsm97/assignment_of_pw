<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>frid_related_assignment10.2</title>
    <style>
     * {
        padding: 0px;
        margin:0px;
        box-sizing: border-box;
     }
     .main {
      height:fit-content;
      width: 100vw;
     }
     .custom_grid {
      display:grid;
      grid-auto-rows: 150px; /*  in this method you decide the height of the grid container   */
      grid-auto-columns: 100px;/*  in this method you decide the width of the grid container   */
      row-gap: 20px; 
      column-gap: 20px;
      padding: 20px;
     }
     .child1 {

        background-color: aqua;
     }
     .child2 {
        background-color: rgb(83, 24, 33);
     }
     .child3 {
        background-color: rgb(171, 111, 224);
     }
     .child4 {
        background-color: rgb(31, 235, 82);
     }
     .child5 {
        background-color: rgb(219, 254, 46);
     }
   </style>
</head>
<body>
    <div class="main">
      <div class="content">
         <div><h1>grid-auto-rows</h1><p>in this method you decide the height of the grid container if no overrides will occur</p></div>
         <div><h1>grid-auto-columns</h1><p>in this method you decide the width of the grid container if no overrides will occur</p></div>
      </div>
      <div class="custom_grid">
         <div class="child1">1</div>
         <div class="child2">2</div>
         <div class="child3">3</div>
         <div class="child4">4</div>
         <div class="child5">5</div>
      </div>
    </div>
</body>
</html>
