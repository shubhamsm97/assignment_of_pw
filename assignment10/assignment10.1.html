<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>assignment_of_grid.1</title>
    <style>
        * {
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }
        .main {
            padding: 2% 1% 2% 1%;
            width: 100vw;
            height: 100vh;
            display: grid;
            row-gap: .8%;
            column-gap: .8%;
            grid-template-columns: repeat(3,1fr);
            grid-template-rows: repeat(2,1fr);
        }
        .child1 {
            grid-row: 1/2;
            grid-column: 1/3;
            background-color: antiquewhite;
            border:2px solid black;
            padding: 4% 2% 4% 2%;
        }
        .child2 {
            background-color: antiquewhite;
            border:2px solid black;
            grid-row: 1/3;
            padding: 4% 2% 4% 2%;
        }
        .child3 {
            background-color: antiquewhite;
            border:2px solid black;
            padding: 4% 2% 4% 2%;
        }
        .child4 {
            background-color: antiquewhite;
            border:2px solid black;
            padding: 4% 2% 4% 2%;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="child1">A</div>
        <div class="child2">B</div>
        <div class="child3">C</div>
        <div class="child4">D</div>
    </div>
</body>
</html>
